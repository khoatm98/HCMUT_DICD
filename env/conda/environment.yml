# =============================================================================
# HCMUT_DICD conda environment -- FULL profile (all-conda, no Docker).
#
# The complete open-source toolchain on conda for a no-Docker setup: front-end
# (sim/synth) + back-end (OpenROAD/Magic/Netgen) + the SKY130 PDK. APR
# orchestration is done with OpenROAD-flow-scripts (ORFS); see env/conda/README.md.
#
# Create it with:   PROFILE=full bash env/conda/setup.sh
# setup.sh runs the solve with FLEXIBLE channel priority.
#
# WHY python=3.7:  the only litex-hub OpenROAD build whose low-level deps still
# resolve against today's conda-forge is the 2.0_3175 (2022) build, and it is
# pinned to python 3.7. Newer OpenROAD builds need a pruned libboost 1.73 /
# _openmp_mutex >=5.1 combo that no longer resolves. So the WHOLE all-conda
# back-end hangs off python=3.7. (Verified resolvable 2026-06; iverilog/yosys/
# verilator/magic/netgen/open_pdks all have py3.7-compatible builds.)
#
# NOT here: KLayout (its litex-hub build needs a pruned Qt 5.6.3 and the
# conda-forge build needs python>=3.8 -> conflicts with the py3.7 OpenROAD);
# and `ciel` (pip; needs python>=3.8). GDS viewing is optional -- install
# KLayout in a SEPARATE env (`conda create -n klayout -c conda-forge klayout`)
# or via the system package; the PDK comes from open_pdks.sky130a, not ciel.
# =============================================================================
name: hcmut-eda

channels:
  - litex-hub          # conda-eda EDA tool builds
  - conda-forge
  - nodefaults

dependencies:
  # Pinned to 3.7 because the resolvable litex-hub OpenROAD build requires it
  # (see header). WITHOUT this pin, conda keeps the newest python and the
  # OpenROAD solve fails. Plain (un-prefixed) tool names + flexible priority let
  # conda pick the litex-hub py3.7 builds and pull low-level deps from conda-forge.
  - python=3.7

  # ---- front-end (sim + synthesis) ----
  - make
  - iverilog
  - verilator
  - gtkwave
  - yosys

  # ---- back-end ----
  - openroad        # APR engine; ALSO embeds OpenSTA -> run STA/power via `openroad`
  - magic           # DRC + layout
  - netgen          # LVS  (NB: conda-forge 'netgen' is a different MESH tool; litex-hub's is the IC one)

  # ---- SKY130 PDK (installs under $CONDA_PREFIX/share/pdk) ----
  - open_pdks.sky130a
  # Notes:
  #  * There is no standalone 'opensta' package; OpenSTA is inside 'openroad'
  #    (the flow Makefiles auto-pick `sta` if present, else `openroad`).
  #  * KLayout / ciel are intentionally omitted (python>=3.8) -- see header.
  #  * APR uses OpenROAD-flow-scripts (ORFS), not LibreLane (LibreLane's
  #    non-Docker path is Nix). See env/conda/README.md.

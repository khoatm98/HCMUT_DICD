# =============================================================================
# HCMUT_DICD conda environment -- FULL profile (all-conda, no Docker).
#
# The complete open-source toolchain on conda for a no-Docker setup: front-end
# (sim/synth) + back-end (OpenROAD/Magic/Netgen/KLayout) + the SKY130 PDK. APR
# orchestration is done with OpenROAD-flow-scripts (ORFS); see env/conda/README.md.
#
# Create it with:   PROFILE=full bash env/conda/setup.sh
# setup.sh runs the solve with FLEXIBLE channel priority -- this is what lets the
# newest litex-hub OpenROAD build pull its low-level deps (e.g. _openmp_mutex,
# libboost) from conda-forge instead of failing. (BEST-EFFORT: the litex-hub
# builds are version-sensitive; if the solve fails, pin specific builds or update
# litex-hub -- see README.)
# =============================================================================
name: hcmut-eda

channels:
  - litex-hub          # conda-eda EDA tool builds
  - conda-forge
  - nodefaults

dependencies:
  # ---- front-end (sim + synthesis) ----
  - make
  - iverilog
  - verilator
  - gtkwave
  - yosys

  # ---- back-end (litex-hub conda-eda) ----
  - openroad            # APR engine; ALSO embeds OpenSTA -> run STA/power via `openroad`
  - magic               # DRC + layout
  - netgen              # LVS
  - klayout             # GDS viewer + DRC

  # ---- SKY130 PDK (installs under $CONDA_PREFIX/share/pdk) ----
  - open_pdks.sky130a

  # ---- pip extras ----
  - pip
  - pip:
      - ciel            # PDK manager (fallback / alternative to open_pdks.sky130a)
  # Notes:
  #  * No python pin -- let the solver pick a version the tools accept.
  #  * There is no standalone 'opensta' package; OpenSTA is inside 'openroad'
  #    (the flow Makefiles auto-pick `sta` if present, else `openroad`).
  #  * APR uses OpenROAD-flow-scripts (ORFS), not LibreLane (LibreLane's
  #    non-Docker path is Nix). See env/conda/README.md.

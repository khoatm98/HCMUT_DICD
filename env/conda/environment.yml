# =============================================================================
# HCMUT_DICD conda environment -- FULL profile (EXPERIMENTAL back-end).
#
# WARNING: the litex-hub builds of OpenROAD / KLayout / Magic / Netgen pin old
# boost/qt/ruby versions that frequently CONFLICT with modern conda-forge libs,
# so this environment often fails to solve. If it does, that is expected --
# use the DOCKER path for the back-end (HW3 STA, HW4 power, HW5 APR), which is
# reliable. The front-end profile (environment-frontend.yml) is the supported
# conda setup.
#
# Try it with:   PROFILE=full bash env/conda/setup.sh
# If it won't solve, do NOT fight it -- run the back-end under Docker:
#   make smoke              # full flow in the container
#   make hw3 / hw5          # back-end stages in the container
# =============================================================================
name: hcmut-eda

channels:
  - litex-hub        # conda-eda back-end builds
  - conda-forge
  - nodefaults

dependencies:
  # ---- front-end (reliable, from conda-forge) ----
  - python>=3.9
  - make
  - iverilog
  - verilator
  - gtkwave
  - yosys

  # ---- back-end (litex-hub; EXPERIMENTAL -- may not solve, prefer Docker) ----
  - openroad            # place & route engine (also provides STA)
  - magic               # DRC + layout
  - netgen              # LVS
  - klayout             # GDS viewer
  - open_pdks.sky130a   # SKY130 PDK (~1-2 GB)
  # Note: there is no standalone 'opensta' conda package; OpenSTA is embedded in
  # 'openroad' (run STA scripts with `openroad -exit script.tcl`).

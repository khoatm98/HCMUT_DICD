# =============================================================================
# HCMUT_DICD conda environment -- FRONT-END profile (reliable + fast).
#
# Pure conda-forge, so it solves cleanly and quickly. Covers everything you
# need for HW1 and HW2 (simulation + waveforms) and HW3 synthesis (Yosys).
#
# This is the DEFAULT conda profile:
#     bash env/conda/setup.sh
#
# For the heavy back-end (OpenSTA, OpenROAD/APR, Magic/Netgen/KLayout) use the
# Docker path -- the conda builds of those tools frequently fail to solve.
# =============================================================================
name: hcmut-eda

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11        # pinned to match the full profile (litex-hub tools cap <3.12)
  - make
  - pip
  - iverilog       # HW1, HW2 simulation
  - verilator      # HW1, HW2 fast simulation + lint
  - gtkwave        # waveforms
  - yosys          # HW3 synthesis to SKY130 gates
  - pip:
      - ciel        # SKY130 PDK manager (formerly volare) -- fetch the liberty for synth
